[package]
name = "lodestar-desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 받아쓰기 — sherpa-onnx(오프라인 whisper + Silero VAD). prebuilt 정적 링크(배포 DLL 없음).
sherpa-onnx = "1.13.4"
# 모델 다운로드(스트리밍 → 파일, 진행률)
ureq = "2.12"

[lib]
name = "lodestar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
